```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffd6e7">
    <meta name="description" content="A little place to relax and smile.">

    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="container">

            <div class="outline"></div>

            <div class="content">

                <div class="heart" aria-hidden="true">
                    ❤️
                </div>

                <h1>Hey, you!</h1>

                <p class="message">
                    I know things can get stressful sometimes,
                    so I made this little place for you.
                </p>

                <div class="divider"></div>

                <p class="question">
                    Do you love me? 🥺
                </p>

                <div class="buttons">

                    <button id="yesButton" type="button">
                        Yes ❤️
                    </button>

                    <button id="noButton" type="button">
                        No 😭
                    </button>

                </div>

                <div id="response" aria-live="polite"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
